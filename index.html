<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock, paper, scissors</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div id="title-text">
        <img src="./assets/images/title-text.png" alt="Rock, paper, scissors title">
    </div>
        <div id="battleground">
            <div id="hand-left-space">
                <img src="./assets/images/scissors-hand.png" alt="hand scissors gesture">
            </div>

            <div id="vs">VS</div>

            <div id="hand-right-space">
                <img src="./assets/images/paper-hand.png" alt="hand scissors gesture">
            </div>
    </div>

    <div id="selection-buttons">
        <button>ROCK</button>
        <button>PAPER</button>
        <button>SCISSORS</button>
    </div>

</body>
</html>
