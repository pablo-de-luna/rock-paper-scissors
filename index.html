<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock, paper, scissors</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link 
        href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&display=swap"
        rel="stylesheet"
    >
</head>
<body>
    <div id="title-text">
        <img src="./assets/images/title-text.png" alt="Rock, paper, scissors title">
    </div>

    <div id="game-info">
        <div id="player-score" class="score-info-style"></div>
        <div id="round-info"></div>
        <div id="computer-score" class="score-info-style"></div>
    </div>

    <div id="game-result-text"></div>

    <div id="battleground">
        <div id="hand-left-space">
            <img src="./assets/images/scissors-hand.png"
            alt="hand scissors gesture" width="360" height="225">
        </div>

        <div id="menu">
            <button id="play-button">PLAY</button>
            <div id="round-buttons" class="normal-button-style">
                <button>3 ROUNDS</button>
                <button>5 ROUNDS</button>
                <button>10 ROUNDS</button>
            </div>
        </div>
        
        <div id="hand-right-space">
            <img src="./assets/images/paper-hand.png"
            alt="hand scissors gesture" width="360" height="225">
        </div>
    </div>

    <div id="battle-buttons">
        <div id="selection-buttons" class="normal-button-style">
            <button id="rock-button">ROCK</button>
            <button id="paper-button">PAPER</button>
            <button id="scissors-button">SCISSORS</button>
        </div>
        <button id="fight-button">FIGHT</button>
        <button id="next-round-button">NEXT ROUND</button>
    </div>
    

</body>
</html>
