<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock, paper, scissors</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="title-text">
        <img src="./assets/images/title-text.png" alt="Rock, paper, scissors title">
    </div>

    <div id="game-info">
        <div class="score-info-style">PLAYER: 0</div>
        <div id="round-text">ROUND 1</div>
        <div class="score-info-style">COMPUTER: 1</div>
    </div>

    <div id="battleground">
        <div id="hand-left-space">
            <img src="./assets/images/scissors-hand.png" alt="hand scissors gesture" width="480" height="300">
        </div>

        <div id="menu">
            <button id="play-button">PLAY</button>
            <div id="round-buttons" class="normal-button-style">
                <button>3 ROUNDS</button>
                <button>5 ROUNDS</button>
                <button>10 ROUNDS</button>
            </div>
        </div>
        
        <div id="hand-right-space">
            <img src="./assets/images/paper-hand.png" alt="hand scissors gesture" width="480" height="300">
        </div>
    </div>

    <div id="selection-buttons" class="normal-button-style">
        <button id="rock-button">ROCK</button>
        <button id="paper-button">PAPER</button>
        <button id="scissors-button">SCISSORS</button>
    </div>

</body>
</html>
